[project]
name = "dubious"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seth Lindstrom", email = "lindstromseth92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dubious = "dubious:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
